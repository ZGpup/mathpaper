[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpaper"
version = "0.1.0"
description = "Python-first math worksheet and test generation with Typst."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zephyr Gilmore" }
]

dependencies = [
  "sympy>=1.12",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "build",
  "twine",
]
manim = [
  "manim",
]
plotly = [
  "plotly",
  "kaleido",
]

[project.scripts]
mathpaper = "mathpaper.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathpaper = [
  "templates/typst/**/*.typ",
  "resources/**/*",
]